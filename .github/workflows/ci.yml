name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main', 'master']

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check version bump for native changes
        run: yarn check:version-bump
        if: github.event_name == 'pull_request'
        continue-on-error: false

      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check
